# Apache reverse proxy configuration for Simple Peer AV Chat
# Place this snippet inside the desired <VirtualHost *:80> or <VirtualHost *:443>
# block after enabling the required modules:
#   sudo a2enmod proxy proxy_http proxy_wstunnel headers

# WebSocket upgrade for signaling (SimplePeer uses wss://host/)
# Browser connects to wss://example.com/peer-call/ws and similar endpoints.
ProxyPass        /peer-call/ws ws://127.0.0.1:4000/ws retry=0 timeout=86400
ProxyPassReverse /peer-call/ws ws://127.0.0.1:4000/ws

# Optional: forward any other peer-call websocket paths, e.g. /peer-call/socket
#ProxyPass        /peer-call/socket ws://127.0.0.1:4000/socket retry=0 timeout=86400
#ProxyPassReverse /peer-call/socket ws://127.0.0.1:4000/socket

# Proxy HTTP requests (static assets + REST) to the Node server
# All traffic is served under https://example.com/peer-call/
ProxyPass        /peer-call/ http://127.0.0.1:4000/
ProxyPassReverse /peer-call/ http://127.0.0.1:4000/

RequestHeader set X-Forwarded-Proto expr=%{REQUEST_SCHEME}
RequestHeader set X-Forwarded-Port expr=%{SERVER_PORT}
